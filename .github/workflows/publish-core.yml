name: Publish Core

# Runs only on the public mirror; the private repository is a no-op.
on:
  push:
    branches: [main]
    paths:
      - "pkgs/core/**"
  workflow_dispatch:

env:
  NODE_VERSION: 24

jobs:
  publish:
    if: github.repository == 'hanakla/paplico'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: publish

    # id-token lets npm exchange a GitHub OIDC token for a short-lived
    # registry credential (trusted publishing), so no npm token is stored.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Trusted publishing needs npm 11.5.1+; pin ahead of whatever Node ships.
      - run: npm install -g npm@latest

      - run: yarn install --immutable

      - name: Check whether the version is already published
        id: version
        run: |
          local_version="$(node -p "require('./pkgs/core/package.json').version")"
          published_version="$(npm view @paplico/core version 2>/dev/null || true)"
          if [ "$local_version" = "$published_version" ]; then
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
            echo "@paplico/core@$local_version is already published; skipping."
          else
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
          fi

      # CI is set on GitHub runners, so only the unit project runs; the GPU
      # suites need a WebGPU adapter the runners do not expose.
      - name: Test
        if: steps.version.outputs.should-publish == 'true'
        run: yarn workspace @paplico/core test

      - name: Build
        if: steps.version.outputs.should-publish == 'true'
        run: yarn workspace @paplico/core build

      # The package resolves to its TypeScript sources during development and
      # only switches to dist through publishConfig, which Yarn applies and npm
      # ignores. Packing with Yarn and unpacking the result hands npm a
      # directory whose manifest is already publish-ready.
      - name: Stage the package
        if: steps.version.outputs.should-publish == 'true'
        run: |
          yarn workspace @paplico/core pack -o "$RUNNER_TEMP/core.tgz"
          mkdir -p "$RUNNER_TEMP/stage"
          tar -xzf "$RUNNER_TEMP/core.tgz" -C "$RUNNER_TEMP/stage"

      # Core pins the @paplico/avif-hdr version from the workspace. When both
      # packages bump in one push, Publish AVIF HDR runs alongside this job,
      # so wait for that version to reach npm rather than publish a core that
      # cannot be installed.
      - name: Wait for the @paplico/avif-hdr version core depends on
        if: steps.version.outputs.should-publish == 'true'
        run: |
          dep_version="$(node -p "require('$RUNNER_TEMP/stage/package/package.json').dependencies['@paplico/avif-hdr']")"
          for _ in $(seq 1 20); do
            if [ -n "$(npm view "@paplico/avif-hdr@$dep_version" version 2>/dev/null)" ]; then
              echo "@paplico/avif-hdr@$dep_version is on npm."
              exit 0
            fi
            echo "Waiting for @paplico/avif-hdr@$dep_version..."
            sleep 30
          done
          echo "@paplico/avif-hdr@$dep_version is not on npm; publish it first." >&2
          exit 1

      - name: Publish
        if: steps.version.outputs.should-publish == 'true'
        working-directory: ${{ runner.temp }}/stage/package
        run: npm publish --access public
