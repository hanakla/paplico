name: Publish AVIF HDR

# Runs only on the public mirror; the private repository is a no-op.
on:
  push:
    branches: [main]
    paths:
      - "pkgs/avif-hdr/**"
  workflow_dispatch:

env:
  NODE_VERSION: 24

jobs:
  publish:
    if: github.repository == 'hanakla/paplico'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: publish

    # id-token lets npm exchange a GitHub OIDC token for a short-lived
    # registry credential (trusted publishing), so no npm token is stored.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Trusted publishing needs npm 11.5.1+; pin ahead of whatever Node ships.
      - run: npm install -g npm@latest

      - run: yarn install --immutable

      - name: Check whether the version is already published
        id: version
        run: |
          local_version="$(node -p "require('./pkgs/avif-hdr/package.json').version")"
          published_version="$(npm view @paplico/avif-hdr version 2>/dev/null || true)"
          if [ "$local_version" = "$published_version" ]; then
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
            echo "@paplico/avif-hdr@$local_version is already published; skipping."
          else
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
          fi

      # The encoder tests decode their output with ffmpeg and dav1d.
      - name: Install ffmpeg (with AVIF alpha support)
        if: steps.version.outputs.should-publish == 'true'
        uses: federicocarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Install dav1d
        if: steps.version.outputs.should-publish == 'true'
        run: sudo apt-get update && sudo apt-get install -y dav1d

      - name: Test
        if: steps.version.outputs.should-publish == 'true'
        run: yarn workspace @paplico/avif-hdr test

      - name: Build
        if: steps.version.outputs.should-publish == 'true'
        run: yarn workspace @paplico/avif-hdr build

      # The package resolves to its TypeScript sources during development and
      # only switches to dist through publishConfig, which Yarn applies and npm
      # ignores. Packing with Yarn and unpacking the result hands npm a
      # directory whose manifest is already publish-ready.
      - name: Stage the package
        if: steps.version.outputs.should-publish == 'true'
        run: |
          yarn workspace @paplico/avif-hdr pack -o "$RUNNER_TEMP/avif-hdr.tgz"
          mkdir -p "$RUNNER_TEMP/stage"
          tar -xzf "$RUNNER_TEMP/avif-hdr.tgz" -C "$RUNNER_TEMP/stage"

      - name: Publish
        if: steps.version.outputs.should-publish == 'true'
        working-directory: ${{ runner.temp }}/stage/package
        run: npm publish --access public
