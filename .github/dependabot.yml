version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: daily
    allow:
      - dependency-type: direct
    groups:
      storybook:
        patterns:
          - "@storybook/*"
          - "storybook"

  - package-ecosystem: cargo
    directory: /pkgs/desktop/src-tauri
    target-branch: dev
    schedule:
      interval: daily
    allow:
      - dependency-type: direct

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: daily
