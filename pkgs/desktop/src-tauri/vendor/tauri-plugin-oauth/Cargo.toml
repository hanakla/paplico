[package]
name = "tauri-plugin-oauth"
version = "2.1.0"
authors = ["FabianLars <fabianlars@fabianlars.de>"]
description = "A Tauri plugin for spawning a localhost server. Needed for some oauth flows (Login with X)."
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
exclude = [".github/", "examples/", "renovate.json", ".gitignore"]
readme = "README.md"
repository = "https://github.com/FabianLars/tauri-plugin-oauth"
publish = false
links = "tauri-plugin-oauth"

[dependencies]
tauri = { version = "=3.0.0-alpha.6" }
httparse = "1"
log = "0.4"
serde = "1"
url = "2"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "=3.0.0-alpha.4", features = ["build"] }
